<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realtime Notes - Collaborative Markdown Editor</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="header">
        <h1><i class="fas fa-edit"></i> Realtime Notes</h1>
        <div class="connection-status">
            <div class="status-indicator" id="statusIndicator"></div>
            <span id="statusText">Disconnected</span>
            <div class="users-online" id="usersOnline"></div>
        </div>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <input type="password" id="apiKey" class="input api-key-input" placeholder="Enter API Key">
                <button id="connectBtn" class="btn">Connect</button>

                <!-- Search Interface -->
                <div id="searchContainer" class="search-container" style="margin-top: 16px; display: none;">
                    <div class="search-input-wrapper">
                        <input
                            type="text"
                            id="searchInput"
                            class="input search-input"
                            placeholder="Search notes with AI... (Ctrl+K)"
                            autocomplete="off"
                        >
                        <div class="search-actions">
                            <button id="searchBtn" class="btn search-btn">
                                <i class="fas fa-search"></i>
                            </button>
                            <button id="searchClearBtn" class="btn search-clear-btn" style="display: none;">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>

                        <!-- Autocomplete Suggestions -->
                        <div id="searchSuggestions" class="search-suggestions">
                            <!-- Suggestions will be populated here -->
                        </div>
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <button id="searchToggleFilters" class="search-toggle-filters">
                            <i class="fas fa-filter"></i> Filters
                        </button>
                        <button id="searchToggleHistory" class="search-toggle-filters" style="font-size: 11px;">
                            <i class="fas fa-history"></i> History
                        </button>
                    </div>

                    <!-- Advanced Search Filters -->
                    <div id="searchFilters" class="search-filters">
                        <div class="filter-group">
                            <label class="filter-label">Results</label>
                            <div class="filter-controls">
                                <input
                                    type="number"
                                    id="filterTopK"
                                    class="input filter-input"
                                    placeholder="10"
                                    min="1"
                                    max="50"
                                    value="10"
                                >
                                <span style="font-size: 11px; color: #6c757d;">max results</span>
                            </div>
                        </div>

                        <div class="filter-group">
                            <label class="filter-label">Relevance</label>
                            <div class="filter-controls">
                                <input
                                    type="range"
                                    id="filterMinScore"
                                    class="filter-input"
                                    min="0"
                                    max="1"
                                    step="0.1"
                                    value="0"
                                    style="width: 100px;"
                                >
                                <span id="filterMinScoreValue" style="font-size: 11px; color: #6c757d;">0.0+</span>
                            </div>
                        </div>

                        <div class="filter-group">
                            <label class="filter-label">Options</label>
                            <div class="filter-controls">
                                <label style="font-size: 12px; color: #a0a0a0; display: flex; align-items: center;">
                                    <input
                                        type="checkbox"
                                        id="filterTitleOnly"
                                        class="filter-checkbox"
                                    >
                                    Title only
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Search Stats -->
                    <div id="searchStats" class="search-stats">
                        <span id="searchStatsText">No search performed</span>
                    </div>

                    <!-- Search History -->
                    <div id="searchHistory" class="search-history">
                        <!-- History items will be populated here -->
                    </div>
                </div>

                <div class="create-note-form" style="margin-top: 16px;">
                    <input type="text" id="newNoteTitle" class="input create-note-input" placeholder="New note title">
                    <button id="createNoteBtn" class="btn btn-secondary">Create</button>
                </div>
            </div>

            <div class="notes-list" id="notesList">
                <!-- Search Results Container -->
                <div id="searchResults" class="search-results">
                    <!-- Loading State -->
                    <div id="searchLoading" class="search-loading" style="display: none;">
                        <i class="fas fa-spinner"></i>
                        <p style="margin: 8px 0 0 0;">Searching...</p>
                    </div>

                    <!-- Empty State -->
                    <div id="searchEmptyState" class="search-empty-state" style="display: none;">
                        <i class="fas fa-search"></i>
                        <p style="margin: 8px 0 0 0;">No results found</p>
                        <p style="font-size: 11px; margin: 4px 0 0 0;">Try different keywords or adjust filters</p>
                    </div>

                    <!-- Results List -->
                    <div id="searchResultsList">
                        <!-- Search results will be populated here -->
                    </div>
                </div>

                <!-- Default Notes List -->
                <div id="defaultNotesList">
                    <div class="empty-state">
                        <i class="fas fa-sticky-note"></i>
                        <p>Enter your API key to load notes</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="editor-container">
            <div class="editor-header">
                <input type="text" id="noteTitle" class="input note-title-input input-large" placeholder="Note Title" disabled>
                <div class="users-online">
                    <span>Version: <span id="noteVersion">-</span></span>
                    <button id="deleteNoteBtn" class="btn btn-danger btn-small" style="margin-left: 12px;" disabled>
                        <i class="fas fa-trash"></i> Delete
                    </button>
                </div>
            </div>

            <div class="editor-content">
                <div class="editor-pane" id="editorPane">
                    <div class="pane-header">
                        <i class="fas fa-code"></i> Markdown Editor
                    </div>
                    <textarea id="markdownEditor" class="editor-textarea" placeholder="Start typing your markdown here..." disabled></textarea>
                </div>

                <div class="resizer" id="resizer"></div>

                <div class="editor-pane" id="previewPane">
                    <div class="pane-header">
                        <i class="fas fa-eye"></i> Live Preview
                    </div>
                    <div id="markdownPreview" class="preview-content">
                        <div class="empty-state">
                            <i class="fas fa-file-alt"></i>
                            <p>Select a note to start editing</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <script type="module" src="dist/app.js"></script>
</body>
</html>
